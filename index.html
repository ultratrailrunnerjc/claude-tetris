<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro">☀ Claro</button>
    <h1 class="title">TETRIS</h1>

    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section">
          <span class="label">ENERGÍA</span>
          <div id="energy-bar"><div id="energy-fill"></div></div>
          <span class="goal"><kbd>E</kbd> habilidad</span>
          <span class="goal" id="ability-status"></span>
        </div>
        <div class="panel-section" id="hold-section">
          <span class="label">HOLD <kbd>C</kbd> <kbd>⇧</kbd></span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>
        <div class="panel-section hidden" id="queue-section">
          <span class="label">PRÓXIMAS</span>
          <canvas id="queue-canvas" width="60" height="240"></canvas>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">MODO</span>
          <span class="value small" id="mode-name"></span>
          <span class="goal" id="goal">—</span>
        </div>
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">—</span>
          <span class="b2b" id="b2b">B2B</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>C</kbd>/<kbd>Shift</kbd> reserva</li>
            <li><kbd>M</kbd> sonido</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="mode-menu" class="mode-menu hidden"></div>
        <div id="ability-menu" class="mode-menu hidden"></div>
        <button id="restart-btn">Reintentar</button>
        <button id="menu-btn" type="button">Menú</button>
      </div>
    </div>
  </div>

  <script>
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
  <script src="game.js"></script>
</body>
</html>
